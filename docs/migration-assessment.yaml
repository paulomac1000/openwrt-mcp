evidence_binding:
  model: >-
    This file assesses the candidate tree and required evidence classes. Exact commit
    SHA, workflow run ID, and artifact digests are bound externally by provider-backed
    GitHub Actions records and the pull-request evidence summary, avoiding a
    self-referential SHA inside the candidate commit.
  recurring_provider_evidence:
    - exact-revision hosted CI with official MCP SDK 2.0.0
    - exact-wheel modern and legacy stdio subprocess smoke outside the checkout
    - exact-container modern and legacy stdio subprocess smoke
    - Ruff, mypy strict, Bandit, pip-audit, branch coverage >= 90%, wheel and image checks
    - retained JUnit execution counts and artifact digests
baseline_policy:
  pinned_revision_reason: >-
    661ff01a5e70d58d6c94a12545b24647e52063ed remains the last trusted immutable
    baseline adopted by this branch. The latest unified-contract candidate observed
    during this assessment is c5ba4091cd8a3043fe4ba9715a3bda96d62a05e4; it is not
    adopted because its exact-head workflow set is red and its capability-manifest
    machine schema and normative reference remain contradictory.
  workflow_auditor_revision: c6dc6b13b2dd40b6e087140cd071b45067d75b39
  workflow_auditor_scope: >-
    Used narrowly as an immutable profile-aware GitHub Actions policy auditor over the
    complete candidate workflow set. This does not adopt that revision's conflicting
    manifest or evidence contract as project SSOT.
  next_action: >-
    Migrate the standards lock, canonical manifests, and provider-backed adoption
    assessment together after ai-skills publishes a green immutable successor whose
    schema, normative reference, generator, semantic validator, and evidence contract
    agree.
implemented:
  - official MCP Python SDK 2.0.0 is the required runtime dependency
  - supported host interpreter is POSIX CPython 3.12.x; unsupported host identity fails closed
  - stdio is the only MCP invocation transport in the supported profile
  - the invocation kernel owns closed argument validation, deadlines, target serialization, and final response byte limits
  - the MCP adapter publishes the exact kernel input schema after wrapper field/required parity checks
  - controlled MCP failures carry sanitized structured error content; unexpected operation TypeError/ValueError map to INTERNAL
  - all active capability manifests default to retryable=false, idempotent=false, reversible=false unless operation-specific evidence is added
  - inactive write and destructive capabilities are not registered and do not claim server-enforced confirmation
  - real-mode configuration fails fast for missing known-hosts or missing SSH authentication material
  - SSH host-key verification fails closed outside explicit non-production mock/insecure modes
  - command timeout, cancellation, connection loss, and remote-output overflow invalidate the SSH session before a later reconnect
  - raw SSH stdout/stderr share a 1 MiB pre-decode capture budget before kernel response serialization
  - reads and writes are never automatically replayed after ambiguous connection loss
  - audit output redacts secrets, IPv4/IPv6 addresses and MAC addresses; audit files use no-follow plus mode 0600 where supported
  - exact wheel smoke uses real official-client stdio subprocesses for modern and legacy protocol revisions
  - exact artifact smoke verifies closed schemas, numeric bounds, success mapping, and structured controlled errors
  - CI consumes reviewed committed hashed locks and builds/smoke-tests the container exactly once
  - container runtime is non-root and includes graceful stop/liveness metadata
  - protected publishing promotes the exact CI-exported image archive without source checkout or rebuild
  - L1 requests carry an immutable POSIX process principal distinct from router target identity in internal context/audit
  - model-facing response metadata exposes only caller_boundary and never the raw OS UID
  - MCP private registration internals are isolated in a version-bounded fail-closed compatibility adapter
  - candidate workflows are independently audited as a complete governed set by an immutable profile-aware auditor revision
  - diagnostic evidence and the minimal protected-release payload are uploaded as separate artifacts
  - real-router acceptance tests are executable and environment-gated rather than empty TODO bodies
  - CI enforces that the future write-profile test is the only owned NOT_IMPLEMENTED placeholder
  - cancelled and timed-out remote commands are terminated with SIGKILL before channel close, leaving no orphaned process on the router
  - mock router data mirrors real OpenWRT output shapes: realistic uci key/value samples, logread lines, DHCP events, wifi scan fields, and self-consistent lease resolution
  - e2e smoke tests drive the real stdio subprocess through the official MCP client (catalog, closed schemas, kernel invocation, sanitized controlled errors)
not_claimed:
  - L2 remote principal authentication, capability authorization, or target-binding enforcement
  - stable router identity enrollment or target revalidation
  - server-enforced approval records for write capabilities
  - Windows or other non-POSIX host support
  - Python 3.13 or 3.14 runtime support
  - compliance with the red ai-skills c5ba4091cd8a3043fe4ba9715a3bda96d62a05e4 candidate contract
pending_evidence:
  - provider-backed hosted CI on the exact final SHA of this branch
  - independent latest-format adoption assessment after a green unified ai-skills baseline exists
real_router_lab_record:
  environment: >-
    Isolated OpenWRT laboratory router with dropbear SSH server, OpenWRT 23.05
    line, kernel 5.15.150. Full environment details and JUnit XML are retained
    externally and are not committed to the repository.
  command: >-
    OPENWRT_LAB_RUN=1 OPENWRT_MOCK_MODE=0 OPENWRT_LAB_SLOW_TARGET=198.51.100.254
    python -m pytest -vv -m lab tests/integration/test_real_router_acceptance.py
  result: 5 passed, 0 failed, 0 skipped (2026-08-09, Python 3.12.13, asyncssh 2.24.0, mcp 2.0.0)
deferred_non_profile_evidence:
  - NOT_IMPLEMENTED real-router write authorization/approval workflow if a future profile activates write capabilities
waivers: []
