# AFDS Validator Configuration for openwrt-mcp project

exempt_files: []

root_files:
  README.md:
    required_fields: [description, doc_id, type, status, last_verified]
    min_line_count: 8

  CHANGELOG.md:
    required_fields: [description, doc_id, type, status, last_verified]
    min_line_count: 5

default_paths:
  - docs/

excluded_dirs:
  - archived
  - archive
