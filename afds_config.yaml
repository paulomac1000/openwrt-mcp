# AFDS Validator Configuration for openwrt-mcp project

exempt_files:
  - README.md
  - CHANGELOG.md
  - docs/meta/doc-registry.md
  - docs/meta/glossary.md

default_paths:
  - docs/

excluded_dirs:
  - archived
  - archive
  - docs/meta  # meta files (doc-registry.md, glossary.md) are exempt from AFDS validation
