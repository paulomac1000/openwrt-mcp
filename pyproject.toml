[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openwrt-mcp"
version = "1.3.0"
description = "Hardened read-only MCP server for OpenWRT diagnostics"
requires-python = ">=3.12,<3.15"
dependencies = [
  "mcp>=2.0.0,<3",
  "asyncssh>=2.23,<3",
  "starlette>=0.50,<2",
  "uvicorn>=0.48,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "coverage>=7,<8",
  "build>=1.3,<2",
  "pip-audit>=2.9,<3",
  "httpx>=0.28,<1",
  "ruff>=0.15,<1",
  "mypy>=2.1,<3",
  "bandit>=1.9,<2",
]

[project.scripts]
openwrt-mcp = "openwrt_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "unit: deterministic unit tests",
  "integration: SDK or real-dependency integration tests",
  "e2e: end-to-end application tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.coverage.run]
source = ["src/openwrt_mcp"]
omit = ["src/openwrt_mcp/__main__.py", "src/openwrt_mcp/artifact_smoke.py"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
