[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "openwrt-mcp"
dynamic = ["version"]
description = "Hardened read-only MCP server for OpenWRT diagnostics"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "mcp==2.0.0",
  "asyncssh==2.24.0",
]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "build==1.5.1",
  "coverage==7.13.3",
  "mypy==2.1.0",
  "pip-audit==2.10.0",
  "pip-tools==7.6.0",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "pyyaml==6.0.3",
  "ruff==0.15.13",
  "setuptools==82.0.1",
  "wheel==0.46.1",
]

[project.scripts]
openwrt-mcp = "openwrt_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "openwrt_mcp.__version__"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "unit: deterministic unit tests",
  "integration: SDK or real-dependency integration tests",
  "e2e: end-to-end application tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.coverage.run]
source = ["src/openwrt_mcp"]
omit = ["src/openwrt_mcp/__main__.py", "src/openwrt_mcp/artifact_smoke.py"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
