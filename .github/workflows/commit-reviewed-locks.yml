name: Commit reviewed dependency locks

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: commit-reviewed-locks-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  commit-locks:
    if: >-
      github.event.pull_request.number == 39 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ai-skills-compliance-refactor'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/ai-skills-compliance-refactor
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Regenerate and verify reviewed locks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pip==26.0.1 pip-tools==7.6.0
          python -m piptools compile --generate-hashes --allow-unsafe \
            --output-file requirements-runtime.lock requirements-runtime.in
          python -m piptools compile --generate-hashes --allow-unsafe \
            --output-file requirements-dev.lock requirements-dev.in
          echo 'f01ecc7d2b01701671efc9c55e346716ae42a3aaa5c1316accc517a62fb6829b  requirements-runtime.lock' | sha256sum --check -
          echo '9118c2c357b2a43e1606a1a85b41fa2da1476eb13576f54cf92775a1d28b0aa7  requirements-dev.lock' | sha256sum --check -

      - name: Commit exact reviewed locks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Agent'
          git config user.email 'openai-agent@users.noreply.github.com'
          git add requirements-runtime.lock requirements-dev.lock
          git diff --cached --check
          git commit -m 'build: commit reviewed hashed dependency locks'
          git push origin HEAD:agent/ai-skills-compliance-refactor
