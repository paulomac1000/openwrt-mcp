name: Export review head

on:
  pull_request:
    types: [reopened]

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.event.pull_request.number == 39 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ai-skills-compliance-refactor'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Archive exact checkout
        shell: bash
        run: tar -czf /tmp/openwrt-mcp-head.tgz .

      - name: Upload exact checkout
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openwrt-mcp-review-head-${{ github.run_id }}
          path: /tmp/openwrt-mcp-head.tgz
          if-no-files-found: error
          retention-days: 1
