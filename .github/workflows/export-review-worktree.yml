name: Export review worktree

on:
  push:
    branches:
      - agent/ai-skills-compliance-refactor
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-review-worktree-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Remove export workflow from archive
        run: rm -f .github/workflows/export-review-worktree.yml

      - name: Upload worktree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openwrt-mcp-review-worktree-${{ github.sha }}
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
