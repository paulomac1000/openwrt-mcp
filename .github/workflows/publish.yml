# ai-skills-policy-profile: protected-release
name: Publish tested container

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  verify-ci-payload:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      evidence_sha256: ${{ steps.verify.outputs.evidence_sha256 }}
      image_sha256: ${{ steps.verify.outputs.image_sha256 }}
      image_id: ${{ steps.verify.outputs.image_id }}
    steps:
      - name: Download minimal exact release payload
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: openwrt-mcp-release-${{ github.event.workflow_run.id }}
          path: release-payload
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify closed CI payload without executing it
        id: verify
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release-payload
          sha256sum --check ci-evidence.sha256
          sha256sum --check image.sha256
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(Path("ci-evidence.json").read_text(encoding="utf-8"))
          if evidence["provider"] != "github-actions":
              raise SystemExit("unexpected evidence provider")
          if evidence["repository"] != os.environ["EXPECTED_REPOSITORY"]:
              raise SystemExit("repository identity mismatch")
          if evidence["revision"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("source revision mismatch")
          if evidence["run_id"] != int(os.environ["EXPECTED_RUN_ID"]):
              raise SystemExit("producer run mismatch")
          if evidence["image"]["source_revision"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("image source label mismatch")
          PY
          docker load --input image.tar.gz
          image="openwrt-mcp:ci-$EXPECTED_SHA"
          docker image inspect "$image" | python -c '
          import json, os, sys
          from pathlib import Path
          evidence = json.loads(Path("ci-evidence.json").read_text(encoding="utf-8"))
          image = json.load(sys.stdin)[0]
          labels = image["Config"]["Labels"]
          if (image["Id"] != evidence["image"]["image_id"]
              or labels["org.opencontainers.image.revision"] != os.environ["EXPECTED_SHA"]
              or labels["org.opencontainers.image.version"] != evidence["image"]["version"]
              or "sha256:" + labels["io.openwrt-mcp.wheel.sha256"] != evidence["artifacts"]["wheel"]["digest"]):
              raise SystemExit("release image provenance mismatch")
          '
          echo "evidence_sha256=$(sha256sum ci-evidence.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "image_sha256=$(sha256sum image.tar.gz | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "image_id=$(docker image inspect --format '{{.Id}}' "$image")" >> "$GITHUB_OUTPUT"

  publish:
    if: github.event.workflow_run.conclusion == 'success'
    needs: verify-ci-payload
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ghcr-production
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download minimal exact release payload
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: openwrt-mcp-release-${{ github.event.workflow_run.id }}
          path: release-payload
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-verify and load exact smoke-tested image
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          VERIFIED_IMAGE_SHA256: ${{ needs.verify-ci-payload.outputs.image_sha256 }}
          VERIFIED_EVIDENCE_SHA256: ${{ needs.verify-ci-payload.outputs.evidence_sha256 }}
          VERIFIED_IMAGE_ID: ${{ needs.verify-ci-payload.outputs.image_id }}
        run: |
          set -euo pipefail
          cd release-payload
          printf '%s  ci-evidence.json\n' "$VERIFIED_EVIDENCE_SHA256" | sha256sum --check -
          printf '%s  image.tar.gz\n' "$VERIFIED_IMAGE_SHA256" | sha256sum --check -
          sha256sum --check ci-evidence.sha256
          sha256sum --check image.sha256
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(Path("ci-evidence.json").read_text(encoding="utf-8"))
          expected = {
              "provider": "github-actions",
              "repository": os.environ["EXPECTED_REPOSITORY"],
              "revision": os.environ["EXPECTED_SHA"],
              "run_id": int(os.environ["EXPECTED_RUN_ID"]),
          }
          for key, value in expected.items():
              if evidence.get(key) != value:
                  raise SystemExit(f"evidence mismatch for {key}")
          if evidence["image"]["source_revision"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("image source label mismatch")
          PY
          docker load --input image.tar.gz
          image="openwrt-mcp:ci-$EXPECTED_SHA"
          test "$(docker image inspect --format '{{.Id}}' "$image")" = "$VERIFIED_IMAGE_ID"
          test "$(docker image inspect --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$EXPECTED_SHA"

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote exact CI image
        shell: bash
        env:
          VERIFIED_IMAGE_ID: ${{ needs.verify-ci-payload.outputs.image_id }}
        run: |
          set -euo pipefail
          target="ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha }}"
          docker tag "$VERIFIED_IMAGE_ID" "$target"
          docker push "$target"

      - name: Resolve pushed digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          tag="ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha }}"
          docker pull "$tag"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$tag" | cut -d@ -f2)"
          test -n "$digest"
          echo "value=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest pushed digest
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true
