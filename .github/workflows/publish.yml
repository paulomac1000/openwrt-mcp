name: Publish tested container

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact CI revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact CI evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: openwrt-mcp-evidence-${{ github.event.workflow_run.id }}
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify downloaded wheel and locks
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
          sha256sum --check wheel.sha256
          test -s requirements-runtime.lock
          test -s requirements-dev.lock

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image only from tested artifacts
        run: |
          set -euo pipefail
          tag=ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha }}
          docker build --tag "$tag" .
          docker run --rm -e OPENWRT_MOCK_MODE=1 "$tag" \
            python -m openwrt_mcp.artifact_smoke
          docker push "$tag"

      - name: Resolve pushed digest
        id: digest
        run: |
          set -euo pipefail
          tag=ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha }}
          docker pull "$tag"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$tag" | cut -d@ -f2)"
          test -n "$digest"
          echo "value=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest pushed digest
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true
