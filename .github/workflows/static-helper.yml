name: Static preflight helper

on:
  push:
    branches:
      - agent/production-preflight-20260808

permissions:
  contents: read

jobs:
  static-helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout exact helper revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install exact development environment
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Apply pinned Ruff and capture mypy
        shell: bash
        run: |
          set -u
          python -m ruff check --fix src tests scripts || true
          python -m ruff format src tests scripts
          git diff -- src tests scripts > /tmp/static-fixes.patch
          python -m mypy src/openwrt_mcp scripts --strict > /tmp/mypy.txt 2>&1 || true
      - name: Upload helper evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: static-helper-output
          path: |
            /tmp/static-fixes.patch
            /tmp/mypy.txt
          if-no-files-found: error
          retention-days: 1
