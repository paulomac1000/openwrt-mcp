name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AI_SKILLS_SHA: 661ff01a5e70d58d6c94a12545b24647e52063ed
  WORKFLOW_AUDITOR_SHA: c6dc6b13b2dd40b6e087140cd071b45067d75b39
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  quality-artifact-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout trusted ai-skills revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: paulomac1000/ai-skills
          ref: ${{ env.AI_SKILLS_SHA }}
          path: .trusted/ai-skills
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout immutable profile-aware workflow auditor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: paulomac1000/ai-skills
          ref: ${{ env.WORKFLOW_AUDITOR_SHA }}
          path: .trusted/workflow-auditor
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.lock
            requirements-dev.lock

      - name: Verify assessed revisions and committed locks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C .trusted/ai-skills rev-parse HEAD)" = "$AI_SKILLS_SHA"
          test "$(git -C .trusted/workflow-auditor rev-parse HEAD)" = "$WORKFLOW_AUDITOR_SHA"
          test -s requirements-runtime.lock
          test -s requirements-dev.lock
          grep -q '^mcp==2\.0\.0 \\' requirements-runtime.lock
          grep -q '^asyncssh==2\.24\.0 \\' requirements-runtime.lock

      - name: Install exact development environment
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Run trusted standards validators
        run: |
          set -euo pipefail
          python .trusted/ai-skills/skills/afds-doc-writer/validate.py docs/openwrt-mcp.md
          baseline_root="$(mktemp -d)"
          mkdir -p "$baseline_root/.github/workflows"
          cp .github/workflows/ci.yml "$baseline_root/.github/workflows/ci.yml"
          python .trusted/ai-skills/skills/ci-cd-architect/tools/check_github_actions_policy.py "$baseline_root"
          python .trusted/workflow-auditor/skills/ci-cd-architect/tools/check_github_actions_policy.py "$GITHUB_WORKSPACE"

      - name: Run repository diagnostics
        run: |
          set -euo pipefail
          python scripts/check_ai_skills_lock.py
          python scripts/validate_docs.py AGENTS.md docs/openwrt-mcp.md
          python scripts/check_workflows.py

      - name: Static quality and security
        run: |
          set -euo pipefail
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
          python -m mypy src/openwrt_mcp scripts --strict
          python -m bandit -q -lll -iii -r src/openwrt_mcp scripts
          python -m pip_audit -r requirements-runtime.lock

      - name: Run deterministic repository gate
        run: python scripts/ci.py

      - name: Run official MCP client acceptance tests
        run: python -m pytest -q --junitxml=official-mcp-junit.xml tests/integration/test_official_mcp_client.py

      - name: Run branch coverage
        run: |
          set -euo pipefail
          python -m coverage run --branch -m pytest -q -m "not integration" --junitxml=non-integration-junit.xml
          python -m coverage report --fail-under=90
          python -m coverage xml -o coverage.xml

      - name: Build exact wheel without build isolation
        run: |
          set -euo pipefail
          rm -rf build dist
          python -m build --wheel --no-isolation
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          sha256sum dist/*.whl | tee wheel.sha256

      - name: Smoke exact installed wheel through real stdio
        run: |
          set -euo pipefail
          python -m venv /tmp/openwrt-wheel-smoke
          /tmp/openwrt-wheel-smoke/bin/python -m pip install --require-hashes \
            -r requirements-runtime.lock
          /tmp/openwrt-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          (cd /tmp && /tmp/openwrt-wheel-smoke/bin/python \
            -m openwrt_mcp.artifact_smoke)

      - name: Build exact container image once
        run: |
          set -euo pipefail
          docker build \
            --build-arg SOURCE_REVISION="$CANDIDATE_SHA" \
            --tag "openwrt-mcp:ci-$CANDIDATE_SHA" .

      - name: Smoke exact container image through real stdio
        run: |
          set -euo pipefail
          docker run --rm "openwrt-mcp:ci-$CANDIDATE_SHA" \
            python -m openwrt_mcp.artifact_smoke

      - name: Export exact smoke-tested image and evidence
        shell: bash
        run: |
          set -euo pipefail
          image="openwrt-mcp:ci-$CANDIDATE_SHA"
          docker image inspect "$image" > image-inspect.json
          test "$(docker image inspect --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$CANDIDATE_SHA"
          docker save "$image" | gzip -n > image.tar.gz
          sha256sum image.tar.gz > image.sha256
          python - <<'PY'
          import hashlib
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def digest(path: str) -> str:
              return "sha256:" + hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def junit_summary(path: str) -> dict[str, object]:
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
              return {
                  "path": path,
                  "digest": digest(path),
                  "tests": sum(int(suite.get("tests", "0")) for suite in suites),
                  "failures": sum(int(suite.get("failures", "0")) for suite in suites),
                  "errors": sum(int(suite.get("errors", "0")) for suite in suites),
                  "skipped": sum(int(suite.get("skipped", "0")) for suite in suites),
              }

          inspect = json.loads(Path("image-inspect.json").read_text(encoding="utf-8"))[0]
          wheel = next(Path("dist").glob("*.whl"))
          payload = {
              "schema_version": 1,
              "profile": "l1-local-read-only-stdio",
              "provider": "github-actions",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "revision": os.environ["CANDIDATE_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "job": os.environ["GITHUB_JOB"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "image": {
                  "archive": "image.tar.gz",
                  "archive_digest": digest("image.tar.gz"),
                  "local_reference": f"openwrt-mcp:ci-{os.environ['CANDIDATE_SHA']}",
                  "image_id": inspect["Id"],
                  "source_revision": inspect["Config"]["Labels"]["org.opencontainers.image.revision"],
              },
              "artifacts": {
                  "wheel": {"path": str(wheel), "digest": digest(str(wheel))},
                  "runtime_lock": {"path": "requirements-runtime.lock", "digest": digest("requirements-runtime.lock")},
                  "dev_lock": {"path": "requirements-dev.lock", "digest": digest("requirements-dev.lock")},
                  "coverage": {"path": "coverage.xml", "digest": digest("coverage.xml")},
                  "official_mcp_junit": junit_summary("official-mcp-junit.xml"),
                  "non_integration_junit": junit_summary("non-integration-junit.xml"),
              },
          }
          Path("ci-evidence.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          sha256sum ci-evidence.json > ci-evidence.sha256

      - name: Upload diagnostic provider evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openwrt-mcp-evidence-${{ github.run_id }}
          path: |
            coverage.xml
            official-mcp-junit.xml
            non-integration-junit.xml
            wheel.sha256
            requirements-runtime.lock
            requirements-dev.lock
            dist/*.whl
            image-inspect.json
            ci-evidence.json
            ci-evidence.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: Upload minimal closed release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openwrt-mcp-release-${{ github.run_id }}
          path: |
            image.tar.gz
            image.sha256
            ci-evidence.json
            ci-evidence.sha256
          if-no-files-found: error
          retention-days: 30
