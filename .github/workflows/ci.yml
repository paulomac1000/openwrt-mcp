name: CI

on:
  pull_request:
  push:
    branches: [main, "agent/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AI_SKILLS_SHA: 661ff01a5e70d58d6c94a12545b24647e52063ed

jobs:
  quality-artifact-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout trusted ai-skills revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: paulomac1000/ai-skills
          ref: 661ff01a5e70d58d6c94a12545b24647e52063ed
          path: .trusted/ai-skills
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-runtime.in

      - name: Verify assessed revisions
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git -C .trusted/ai-skills rev-parse HEAD)" = "$AI_SKILLS_SHA"

      - name: Resolve hashed dependency locks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pip-tools==7.6.0
          python -m piptools compile --pre --generate-hashes \
            --output-file requirements-runtime.lock requirements-runtime.in
          python -m piptools compile --pre --generate-hashes --extra dev \
            --output-file requirements-dev.lock pyproject.toml

      - name: Install exact development environment
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Run trusted standards validators
        shell: bash
        run: |
          set -euo pipefail
          python .trusted/ai-skills/skills/afds-doc-writer/validate.py docs/openwrt-mcp.md
          python .trusted/ai-skills/skills/ci-cd-architect/tools/check_github_actions_policy.py "$GITHUB_WORKSPACE"

      - name: Run candidate-tree diagnostics
        run: |
          set -euo pipefail
          python scripts/check_ai_skills_lock.py
          python scripts/validate_docs.py
          python scripts/check_workflows.py

      - name: Static quality and security
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src/openwrt_mcp scripts --strict
          python -m bandit -q -lll -iii -r src/openwrt_mcp scripts
          python -m pip_audit -r requirements-runtime.lock

      - name: Run deterministic repository gate
        run: python scripts/ci.py

      - name: Run official MCP client acceptance tests
        run: python -m pytest -q tests/integration/test_official_mcp_client.py

      - name: Run branch coverage
        run: |
          set -euo pipefail
          python -m coverage run --branch -m pytest -m "not integration"
          python -m coverage report --fail-under=80
          python -m coverage xml -o coverage.xml

      - name: Build exact wheel
        run: |
          set -euo pipefail
          rm -rf build dist
          python -m build --wheel
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          sha256sum dist/*.whl | tee wheel.sha256

      - name: Smoke exact installed wheel through official client
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/openwrt-wheel-smoke
          /tmp/openwrt-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/openwrt-wheel-smoke/bin/python -m pip install --require-hashes -r requirements-runtime.lock
          /tmp/openwrt-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          (cd /tmp && OPENWRT_MOCK_MODE=1 /tmp/openwrt-wheel-smoke/bin/python -m openwrt_mcp.artifact_smoke)

      - name: Build image from tested wheel and lock
        run: docker build --tag openwrt-mcp:${{ github.sha }} .

      - name: Smoke exact container image
        run: |
          set -euo pipefail
          docker run --rm \
            -e OPENWRT_MOCK_MODE=1 \
            openwrt-mcp:${{ github.sha }} \
            python -m openwrt_mcp.artifact_smoke

      - name: Upload diagnostics, locks, and wheel
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openwrt-mcp-evidence-${{ github.run_id }}
          path: |
            coverage.xml
            wheel.sha256
            requirements-runtime.lock
            requirements-dev.lock
            dist/*.whl
          if-no-files-found: warn
          retention-days: 30
