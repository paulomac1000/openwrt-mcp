name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install linting tools
        run: pip install ruff mypy bandit

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy src/openwrt_mcp/ --strict

      - name: bandit
        run: bandit -r src/openwrt_mcp/ -ll

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ -v --tb=short \
            --cov=openwrt_mcp \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short -m integration --cov=openwrt_mcp --cov-append || [ $? -eq 5 ]

  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: openwrt-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker smoke test
        run: |
          docker run -d --rm \
            -p 9096:9096 \
            --name openwrt-smoke \
            -e OPENWRT_HOST=192.168.1.1 \
            -e MCP_UNSAFE_PUBLIC_ACCESS_CONFIRMED=1 \
            openwrt-mcp:test
          sleep 5

          echo "=== Health check ==="
          curl -fsS --retry 10 --retry-delay 2 \
            http://localhost:9096/api/health || exit 1

          echo "=== Tool list ==="
          TOOLS=$(curl -s http://localhost:9096/api/tools \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['total'])")
          echo "Tools registered: $TOOLS"
          [ "$TOOLS" = "24" ] || (echo "FAIL: expected 24 tools, got $TOOLS" && exit 1)

          echo "=== Manifest test ==="
          curl -fsS http://localhost:9096/api/tools/get_router_info/manifest || exit 1

          echo "=== Docker smoke test PASSED ==="
          docker stop openwrt-smoke
