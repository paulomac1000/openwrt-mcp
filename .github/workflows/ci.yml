name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install linting tools
        run: pip install ruff mypy bandit

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy src/openwrt_mcp/ --strict

      - name: bandit
        run: bandit -r src/openwrt_mcp/ -ll

      - name: Validate documentation (CAFDS)
        if: hashFiles('afds_config.yaml') != ''
        run: |
          curl -sS https://raw.githubusercontent.com/paulomac1000/ai-skills/main/skills/afds-doc-writer/docs_validate.py | python3 - \
            --config afds_config.yaml --strict --baseline .afds-baseline.json ./

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ -v --tb=long \
            --cov=openwrt_mcp \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=long -m integration --cov=openwrt_mcp --cov-append || [ $? -eq 5 ]

      - name: Upload coverage to Codecov
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: openwrt-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker smoke test
        run: |
          docker run -d --rm \
            -p 9096:9096 \
            --name openwrt-smoke \
            -e OPENWRT_HOST=192.168.1.1 \
            -e MCP_UNSAFE_PUBLIC_ACCESS_CONFIRMED=1 \
            openwrt-mcp:test
          sleep 5

          echo "=== Health check ==="
          curl -fsS --retry 10 --retry-delay 2 \
            http://localhost:9096/api/health || exit 1

          echo "=== Tool list ==="
          TOOLS=$(curl -s http://localhost:9096/api/tools \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['total'])")
          echo "Tools registered: $TOOLS"
          [ "$TOOLS" = "24" ] || (echo "FAIL: expected 24 tools, got $TOOLS" && exit 1)

          echo "=== Manifest test ==="
          curl -fsS http://localhost:9096/api/tools/get_router_info/manifest || exit 1

          echo "=== Docker smoke test PASSED ==="
          docker stop openwrt-smoke
