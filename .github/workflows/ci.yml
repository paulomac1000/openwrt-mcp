name: CI

on:
  pull_request:
  push:
    branches: [main, "agent/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-artifact-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-runtime.in
            requirements-dev.in

      - name: Verify assessed revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install development environment
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build pip-audit
          python -m pip check

      - name: Static quality and security
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src/openwrt_mcp scripts --strict
          python -m bandit -q -lll -iii -r src/openwrt_mcp scripts
          python -m pip_audit
          python scripts/check_workflows.py

      - name: Run deterministic repository gate
        run: python scripts/ci.py

      - name: Run branch coverage
        run: |
          set -euo pipefail
          python -m coverage run --branch -m pytest -m "not integration"
          python -m coverage report --fail-under=80
          python -m coverage xml -o coverage.xml

      - name: Build exact wheel
        run: |
          set -euo pipefail
          rm -rf build dist
          python -m build --wheel
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          sha256sum dist/*.whl | tee wheel.sha256

      - name: Smoke exact installed wheel through official client
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/openwrt-wheel-smoke
          /tmp/openwrt-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/openwrt-wheel-smoke/bin/python -m pip install dist/*.whl
          (cd /tmp && OPENWRT_MOCK_MODE=1 /tmp/openwrt-wheel-smoke/bin/python -m openwrt_mcp.artifact_smoke)

      - name: Build image from the tested wheel
        run: |
          set -euo pipefail
          docker build --tag openwrt-mcp:${{ github.sha }} .

      - name: Smoke exact container image
        run: |
          set -euo pipefail
          docker run --rm \
            -e OPENWRT_MOCK_MODE=1 \
            openwrt-mcp:${{ github.sha }} \
            python -m openwrt_mcp.artifact_smoke

      - name: Upload diagnostics and wheel
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openwrt-mcp-evidence-${{ github.run_id }}
          path: |
            coverage.xml
            wheel.sha256
            dist/*.whl
          if-no-files-found: error
          retention-days: 30
