name: Format once

on:
  push:
    branches:
      - agent/ai-skills-compliance-refactor
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/ai-skills-compliance-refactor
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install exact development lock
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format src tests scripts
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts
          git commit -m 'style: apply pinned Ruff formatter'
          git push origin HEAD:agent/ai-skills-compliance-refactor
